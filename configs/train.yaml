# configs/train.yaml
experiment:
  seed: 41
  base_dir: "./data/busi"
  train_file_dir: "busi_train.txt"
  val_file_dir: "busi_val.txt"

model:
  # 你想跑什么模型，改这里就行
  name: "SwinUnet" 
  num_classes: 1
  img_size: 224
  
  # ==============================
  # 专门给 SwinUnet 留的“垃圾桶”参数
  # ==============================
  swin_cfg: "src/network/swin_tiny_patch4_window7_224_lite.yaml"

train:
  epoch: 300
  batch_size: 4
  base_lr: 0.01