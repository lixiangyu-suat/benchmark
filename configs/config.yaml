data:
  seed: 41                   # random seed for reproducibility
  base_dir: "./data/busi"    # dataset root
  val_split: 0.3             # proportion of images used for validation

model: #单独输入模型名字。
  num_classes: 1             # segmentation classes (binary = 1)

  # SwinUnet-specific options (ignored by other models)
  SwinUnet:
    opts: null
    cfg: "../../Swin-Unet/configs/swin_tiny_patch4_window7_224_lite.yaml"
    zip: "../data/transunet_ACDC.zip"
    cache_mode: "part"
    resume: null
    accumulation_steps: null
    use_checkpoint: false
    amp_opt_level: "O1"
    tag: null
    eval: false
    throughput: false
    batch_size: 8

train:
  batch_size: 8
  img_size: 256
  epoch: 300
  base_lr: 0.01

eval:
  batch_size: 8
  img_size: 256

log:
  custom_message: ""
